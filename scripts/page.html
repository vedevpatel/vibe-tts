<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vibe-tts</title>
<style>
  :root { --bg: #f7f6f3; --card: #fff; --text: #1d1d1f; --muted: #6b6b70; --line: #e3e1dc; --accent: #3a5bd9; --accent-text: #fff; --warn: #a15c00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161618; --card: #202023; --text: #ececee; --muted: #9b9ba3; --line: #34343a; --accent: #7b96ff; --accent-text: #0e0e10; --warn: #e0a24a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  textarea { width: 100%; min-height: 120px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; padding: 12px;
             font: inherit; color: inherit; background: transparent; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  .styles { display: flex; flex-wrap: wrap; gap: 6px; }
  .styles button { border: 1px solid var(--line); background: transparent; color: inherit; border-radius: 999px; padding: 6px 14px;
                   font: inherit; font-size: 14px; cursor: pointer; }
  .styles button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  label { font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .spacer { flex: 1; }
  #speak { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px; padding: 9px 20px; font: inherit;
           font-weight: 600; cursor: pointer; }
  #speak:disabled { opacity: 0.5; cursor: wait; }
  #status { min-height: 20px; font-size: 13px; color: var(--muted); margin-top: 10px; white-space: pre-wrap; }
  #status.err { color: var(--warn); }
  h2 { font-size: 15px; margin: 28px 0 10px; color: var(--muted); font-weight: 600; }
  .clip { padding: 12px 0; border-top: 1px solid var(--line); }
  .clip:first-child { border-top: 0; }
  .meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
  .meta a { color: var(--accent); }
  .text { margin: 2px 0 6px; overflow-wrap: anywhere; }
  .log { font-size: 12px; color: var(--warn); margin: 4px 0 0; }
  audio { width: 100%; height: 36px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 32px; }
  kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<main>
  <h1>vibe-tts</h1>
  <p class="sub" id="model">loading...</p>
  <div class="card">
    <textarea id="text" placeholder="Type something to say..." maxlength="1000"></textarea>
    <div class="row">
      <div class="styles" id="styles" role="group" aria-label="Style"></div>
      <span class="spacer"></span>
      <label title="Transcribe each clip with Whisper and regenerate it if words are missing or garbled (a few seconds per clip)">
        <input type="checkbox" id="check" checked> check words
      </label>
      <button id="speak">Speak</button>
    </div>
    <div id="status"><kbd>⌘</kbd>/<kbd>Ctrl</kbd> + <kbd>Enter</kbd> to speak</div>
  </div>
  <h2>Clips</h2>
  <div class="card" id="clips"><div class="meta">None yet.</div></div>
  <p class="note" id="notice"></p>
</main>
<script>
const $ = (id) => document.getElementById(id);
let style = null;
const savedStyle = (() => { try { return localStorage.getItem("style"); } catch { return null; } })();

function pickStyle(s) {
  style = s;
  for (const b of $("styles").children) b.setAttribute("aria-pressed", String(b.dataset.style === s));
  try { localStorage.setItem("style", s); } catch {}
}

function clipEl(c, autoplay) {
  const d = document.createElement("div");
  d.className = "clip";
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.innerHTML = `<span></span><span>${c.duration_s}s audio, ${c.generation_s}s to make${c.check ? ", checked" : ""}</span>`;
  meta.firstChild.textContent = c.style;
  const a = document.createElement("a");
  a.href = c.url; a.download = c.file; a.textContent = "download";
  meta.append(a);
  const t = document.createElement("div");
  t.className = "text"; t.textContent = c.text;
  const audio = document.createElement("audio");
  audio.controls = true; audio.src = c.url; audio.preload = "none";
  d.append(meta, t, audio);
  const problems = (c.log || []).filter((m) => !m.startsWith("spoken in"));
  if (problems.length) {
    const l = document.createElement("div");
    l.className = "log"; l.textContent = problems.join("\n");
    d.append(l);
  }
  if (autoplay) { audio.preload = "auto"; audio.play().catch(() => {}); }
  return d;
}

function addClip(c, autoplay) {
  const box = $("clips");
  if (box.querySelector(".meta:only-child")) box.innerHTML = "";
  box.prepend(clipEl(c, autoplay));
}

async function speak() {
  const text = $("text").value.trim();
  if (!text || !style) return;
  $("speak").disabled = true;
  const status = $("status");
  status.className = "";
  const t0 = Date.now();
  const tick = setInterval(() => { status.textContent = `Speaking (${style})... ${Math.round((Date.now() - t0) / 1000)}s`; }, 250);
  try {
    const r = await fetch("/speak", { method: "POST", headers: { "Content-Type": "application/json" },
                                      body: JSON.stringify({ text, style, check: $("check").checked }) });
    const c = await r.json();
    if (!r.ok) throw new Error(c.error || r.statusText);
    addClip(c, true);
    status.textContent = `Done in ${c.generation_s}s.`;
  } catch (e) {
    status.className = "err";
    status.textContent = `Failed: ${e.message}. Is scripts/serve.py still running?`;
  } finally {
    clearInterval(tick);
    $("speak").disabled = false;
  }
}

$("speak").onclick = speak;
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); speak(); } });

fetch("/info").then((r) => r.json()).then((info) => {
  $("model").textContent = `${info.run} · Expresso speaker ex02 · runs on this machine`;
  $("notice").textContent = info.notice;
  for (const s of info.styles) {
    const b = document.createElement("button");
    b.textContent = s; b.dataset.style = s; b.onclick = () => pickStyle(s);
    $("styles").append(b);
  }
  pickStyle(info.styles.includes(savedStyle) ? savedStyle : info.styles[0]);
});
fetch("/history").then((r) => r.json()).then((recs) => { for (const c of recs.reverse()) addClip(c, false); });
</script>
</body>
</html>
